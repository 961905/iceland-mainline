name: main build

# Structure:
#   checkout (前置, once for the whole workflow)
#     └─> bl-kernel   ─┐  (buildbl -> buildkernel; initrd embeds bl's esp.img)
#     └─> userspace   ─┤  (rootfs sparse image, compressed for upload)
#            package  <┘  (deploy blob + ramdeploy bundle, single artifact)

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bl-kernel:
    # native arm64 runner, native arm64 containers: the kernel is
    # ARCH=arm64 LLVM=1 (native compile here), edk2 BaseTools build
    # natively, kernel host tools are aarch64 anyway.  The provision patch
    # flips the default amd64-labelled container to an arm64 rootfs with
    # the union of both package lists — no emulation anywhere.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: reclaim disk (kernel tree + container are heavy)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: checkout this repo + submodules (kernel/bl/container from upstream)
        run: |
          git clone --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --unset-all extensions.partialclone 2>/dev/null || true
          # submodules come from the upstream repos pinned in .gitmodules
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-kernel.git kernel
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-bootloader.git bootloader
          git clone --depth 1 \
            https://github.com/SuperTurtleDev/iceland-build-container.git podman_container

      - name: "patch: all-arm64 containers (no emulation)"
        run: |
          python3 - <<'PY'
          # 1) provision.sh: the amd64-labelled default container becomes an
          #    arm64 rootfs, packages.list gains the union of the arm64 list
          #    (same clang-21 -> CONFIG_CC_VERSION_TEXT matches the hdr-tools
          #    container) plus the packaging/esp-img tools the main stages
          #    need; drop the cross gcc (deployd compiles natively).
          s = open("podman_container/provision.sh").read()
          a = 'case "${ARCH}" in\n    amd64) MACHINE=x86_64;  PKGLIST="packages.list" ;;'
          b = 'case "${ARCH}" in\n    amd64) MACHINE=aarch64; PKGLIST="packages-ci.list" ;;'
          assert a in s, "provision.sh arch case not found"
          s = s.replace(a, b)
          # ccache wrappers for the compiler names kbuild invokes (LLVM=1).
          # NOTE: provision.sh embeds the container script as a single-quoted
          # bash -c '...' string, so every line here must avoid single
          # quotes (hence the unquoted heredoc delimiters and double-quote
          # shell syntax below).  --version/-v bypasses ccache: edk2 build
          # scripts probe CLANG_MAJOR via "clang --version | sed" under
          # pipefail, and ccache hands the bare flag to the real compiler
          # (no input files, exit 1).  CCACHE_DIR points into the mounted
          # OUT so the cache persists on the host across runs.
          marker = s.index("# ---- arm64 static busybox")
          L = [
              "# ccache wrappers (compiler names only; see packages-ci.list)",
              "rm -f /usr/local/bin/clang /usr/local/bin/clang++",
              "cat > /usr/local/bin/clang <<\\CEOF",
              "#!/bin/sh",
              'case "$1" in --version|-v) exec /usr/bin/clang-21 "$@";; esac',
              'export CCACHE_DIR="${CCACHE_DIR:-/work/out/ccache}"',
              'export CCACHE_MAXSIZE="${CCACHE_MAXSIZE:-4G}"',
              'exec ccache /usr/bin/clang-21 "$@"',
              "CEOF",
              "cat > /usr/local/bin/clang++ <<\\CEOF",
              "#!/bin/sh",
              'case "$1" in --version|-v) exec /usr/bin/clang++-21 "$@";; esac',
              'export CCACHE_DIR="${CCACHE_DIR:-/work/out/ccache}"',
              'export CCACHE_MAXSIZE="${CCACHE_MAXSIZE:-4G}"',
              'exec ccache /usr/bin/clang++-21 "$@"',
              "CEOF",
              "chmod 0755 /usr/local/bin/clang /usr/local/bin/clang++",
              "clang --version | head -1",
              "",
          ]
          s = s[:marker] + "\n".join(L) + "\n" + s[marker:]
          open("podman_container/provision.sh", "w").write(s)

          # 2) build-deployd.sh: native static build instead of cross
          s = open("kernel/scripts/build-deployd.sh").read()
          s = s.replace("aarch64-linux-gnu-gcc -static", "gcc -static")
          s = s.replace(
              'command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 \\\n'
              '    || die "aarch64-linux-gnu-gcc missing (add gcc-aarch64-linux-gnu + libc6-dev-arm64-cross to packages.list)"',
              'command -v gcc >/dev/null 2>&1 || die "gcc missing"')
          assert "aarch64-linux-gnu-gcc" not in s, "cross gcc still referenced"
          assert "gcc -static" in s
          open("kernel/scripts/build-deployd.sh", "w").write(s)

          # 2b) initrd-modules.txt: drop the stale regmap-slimbus entry —
          #     the kernel config has CONFIG_SLIMBUS unset, the module is
          #     never built, and verify.sh samples the first manifest paths
          #     (it would otherwise always fail on this line).
          s = open("kernel/initrd-modules.txt").read()
          n = len(s.splitlines())
          s = "\n".join(
              l for l in s.splitlines()
              if "regmap-slimbus" not in l) + "\n"
          open("kernel/initrd-modules.txt", "w").write(s)
          print(f"initrd-modules.txt: dropped regmap-slimbus "
                f"({n - 1} lines remain)")
          print("provision.sh + build-deployd.sh patched")
          PY
          # 3) packages-ci.list: union of both upstream lists (arm64 container
          #    needs the main list's esp-img/packaging/deb tools), minus the
          #    cross gcc pair.  Kept as a workflow-embedded file so the
          #    provision patch can reference it without touching upstream.
          {
            echo "# CI union list: packages.list + packages-arm64.list minus"
            echo "# gcc-aarch64-linux-gnu/libc6-dev-arm64-cross (native arm64"
            echo "# container, no cross compiler needed)."
            echo "# See upstream lists for the rationale of each entry."
            grep -hE -v '^[[:space:]]*(#|$)' podman_container/packages.list \
                 podman_container/packages-arm64.list | \
              grep -v -e '^gcc-aarch64-linux-gnu$' -e '^libc6-dev-arm64-cross$' | \
              sed 's/[[:space:]]*#.*//' | awk 'NF' | sort -u
          } > podman_container/packages-ci.list
          # ccache for the kernel compile (shim + cache dir wired up in the
          # provision patch below)
          echo ccache >> podman_container/packages-ci.list
          echo "--- packages-ci.list:"; cat podman_container/packages-ci.list
          # 4) verify.sh (host side) needs zstd; it is preinstalled on GH
          #    runners, install it explicitly anyway
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends zstd
          zstd --version

      - name: record cache keys
        id: revs
        run: |
          echo "linux=$(git -C kernel rev-parse HEAD:linux)" >> "$GITHUB_OUTPUT"
          echo "container=$(git -C podman_container rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # container rootfs + kernel ccache.  Both are self-validating: runin.sh
      # re-provisions on any identity mismatch, ccache content-hashes every
      # compile — a stale hit can't corrupt the build, it just helps less.
      - name: cache container rootfs
        uses: actions/cache@v4
        with:
          path: |
            build/kernel/podman-data
            build/kernel/podman-data-arm64
          key: podman-arm64-${{ steps.revs.outputs.container }}

      - name: cache kernel ccache
        uses: actions/cache@v4
        with:
          path: build/kernel/ccache
          key: ccache-kernel-${{ steps.revs.outputs.linux }}
          restore-keys: ccache-kernel-

      - name: share one container between bl and kernel
        run: |
          mkdir -p build/bootloader
          ln -s ../kernel/podman-data build/bootloader/podman-data
          # (kernel uses build/kernel/podman-data{,-arm64}; same provision
          # identity, so bl reuses it instead of provisioning a second copy)

      - name: rootless podman prereqs
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          podman info >/dev/null && echo podman-ok

      - name: buildbl.sh
        run: bash scripts/buildbl.sh

      - name: "buildkernel.sh (after bl — initrd embeds bl's esp.img)"
        run: bash scripts/buildkernel.sh

      - name: stage products
        run: |
          K=../build/kernel
          mkdir -p out/kernel out/bootloader
          cp "$K"/SHA256SUMS out/kernel/ 2>/dev/null || true
          cp "$K"/*.img "$K"/*.tar.gz out/kernel/ 2>/dev/null || true
          cp "$K"/initrd_deploy_net_*.cpio.zst out/kernel/ 2>/dev/null || true
          cp -r "$K"/debs "$K"/tools "$K"/ramdeploy "$K"/charge out/kernel/ 2>/dev/null || true
          BL=../build/bootloader
          cp "$BL"/TestBootApp.efi "$BL"/BootApp.efi "$BL"/BootUtil.efi "$BL"/esp.img \
             out/bootloader/ 2>/dev/null || true
          du -sh out

      - uses: actions/upload-artifact@v4
        with:
          name: products-bl-kernel
          retention-days: 3
          path: out

  userspace:
    # native arm64 runner: debootstrap + the sensors deb build run natively
    # (host arch == target arch, no emulation involved).  upstream's
    # build.sh hard-requires a qemu-aarch64 binfmt entry (it assumes an
    # x86 host); patch that check out after clone.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: clone this repo + userspace (submodule from upstream)
        run: |
          git clone --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-userspace.git userspace

      - name: "patch: skip the qemu-aarch64 guard on aarch64 hosts"
        run: |
          python3 - <<'PY'
          import re
          for f in ("userspace/build.sh", "userspace/scripts/build-tree.sh"):
              s = open(f).read()
              # match both one-line and two-line variants of the guard
              new = re.sub(
                  r'^\[ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 \](?:.*die[^\n]*qemu-aarch64[^\n]*\n| \\\n[^\n]*die[^\n]*qemu-aarch64[^\n]*\n)',
                  '# arm64 host: native execution, binfmt guard not applicable\n',
                  s, flags=re.M)
              if 'binfmt_misc/qemu-aarch64' in new:
                  raise SystemExit(f"guard still present in {f}")
              open(f, "w").write(new)
              print(f"patched {f}")
          PY
          grep -n 'qemu-aarch64' userspace/build.sh userspace/scripts/build-tree.sh || echo "guards removed"

      - name: builduserspace.sh
        run: bash scripts/builduserspace.sh

      - name: stage products (compressed sparse image + info)
        run: |
          U=../build/userspace
          mkdir -p out/userspace
          # compress each sparse image for upload (sparse ext4 has lots of
          # zeros; zstd typically halves the size)
          for img in "$U"/*.sparse.img; do
            [ -f "$img" ] || continue
            zstd -3 -T0 -q -o "out/userspace/$(basename "$img").zst" "$img"
            echo "compressed: $(du -h "out/userspace/$(basename "$img").zst")"
          done
          ( cd "$U" 2>/dev/null && sha256sum *.sparse.img *.img 2>/dev/null ) \
            > out/userspace/SHA256SUMS.images || true
          cp "$U"/SHA256SUMS "$U"/buildinfo.txt out/userspace/ 2>/dev/null || true
          du -sh out/userspace/

      - uses: actions/upload-artifact@v4
        with:
          name: products-userspace
          retention-days: 3
          path: out

  package:
    # arm64 runner: makeblob/deployclient come out of the arm64 container
    # (aarch64 ELF); the blob format itself is arch-neutral, and zstd/dpkg
    # run natively here.  (deployclient is recompiled locally on the deploy
    # host when needed — its C source ships in products/kernel.)
    runs-on: ubuntu-24.04-arm
    needs: [bl-kernel, userspace]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: products-bl-kernel, path: products }
      - uses: actions/download-artifact@v4
        with: { name: products-userspace, path: products }

      - name: assemble deploy bundle (blob + ramdeploy)
        run: |
          set -e
          # decompress the sparse rootfs
          mkdir -p work
          for zst in products/userspace/*.sparse.img.zst; do
            [ -f "$zst" ] || continue
            base="${zst%.zst}"
            zstd -d -T0 -q -o "work/$(basename "$base")" "$zst"
          done
          SPARSE=$(find work -name '*.sparse.img' | head -1)
          echo "rootfs: $SPARSE ($(du -h "$SPARSE" 2>/dev/null || echo '?'))"

          # build the deploy blob (rootfs + 4 kernel debs)
          BLOB=""
          if [ -n "$SPARSE" ] && [ -d products/kernel/debs ] && \
             [ -x products/kernel/tools/makeblob ]; then
            BLOB=deploy.blob
            products/kernel/tools/makeblob -o "work/$BLOB" "$SPARSE" \
              products/kernel/debs/linux-firmware-iceland*_arm64.deb \
              products/kernel/debs/linux-headers-*_arm64.deb \
              products/kernel/debs/linux-image-*_arm64.deb \
              products/kernel/debs/linux-modules-*_arm64.deb
            echo "blob: $(du -h "work/$BLOB")"
          else
            echo "WARNING: cannot build blob (missing sparse/debs/makeblob)"
          fi

          # self-contained ramdeploy bundle
          mkdir -p dist/ramdeploy
          cp products/kernel/ramdeploy/*_ramdeploy.bin dist/ramdeploy/ 2>/dev/null || true
          cp products/bootloader/TestBootApp.efi dist/ramdeploy/ 2>/dev/null || true
          cp products/kernel/tools/deployclient dist/ramdeploy/ 2>/dev/null || true
          [ -n "$BLOB" ] && cp "work/$BLOB" dist/ramdeploy/

          cat > dist/ramdeploy/ramdeploy.sh << 'EOS'
          #!/usr/bin/env bash
          # One-shot RAM deploy: device in TestBootApp fastboot (8B0C705).
          # Run from this directory: ./ramdeploy.sh [deploy.blob] [debug]
          set -eu
          D=$(cd "$(dirname "$0")" && pwd)
          BLOB="${1:-$D/deploy.blob}"
          INITRD=initrd_ramdeploy.bin
          [ "${2:-}" = debug ] && INITRD=initrd_debug_ramdeploy.bin
          fastboot flash bootcfg "$D/bootcfg_ramdeploy.bin"
          fastboot flash kernel   "$D/kernel_ramdeploy.bin"
          fastboot flash dtb      "$D/dtb_ramdeploy.bin"
          fastboot flash initrd   "$D/$INITRD"
          fastboot continue || true
          echo "== waiting for deploy NCM (60 s)..."
          for i in $(seq 15); do ip -o addr show 2>/dev/null | grep -q 'enx.*192.168.42' && break; sleep 4; done
          ip -4 -o addr show | grep 192.168.42 | head -1
          "$D/deployclient" 192.168.42.42 5190 "$BLOB"
          EOS
          chmod +x dist/ramdeploy/ramdeploy.sh

          ( cd dist/ramdeploy && sha256sum TestBootApp.efi *_ramdeploy.bin deployclient deploy.blob ramdeploy.sh > SHA256SUMS 2>/dev/null || \
            ( cd dist/ramdeploy && sha256sum * > SHA256SUMS ) )

          # also ship the kernel deb set alongside for packages-only updates
          mkdir -p dist/kernel-products
          cp -r products/kernel/debs dist/kernel-products/ 2>/dev/null || true
          cp products/kernel/tools/makeblob dist/kernel-products/ 2>/dev/null || true

          du -h dist/ramdeploy/* | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: iceland-deploy-${{ github.sha }}
          retention-days: 14
          path: dist
